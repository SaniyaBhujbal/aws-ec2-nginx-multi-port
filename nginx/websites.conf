server {
    listen 80;
    server_name _;
    root /testdata/web80;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8080;
    server_name _;
    root /testdata/web8080;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8081;
    server_name _;
    root /testdata/web8081;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
